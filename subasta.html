<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Subasta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pino:#0c3b29; --pino2:#0f4d32; --hoja:#2f9e62; --hoja2:#1f7a4d;
  --rojo:#c8102e; --rojo2:#9a0b22; --oro:#f2c14e; --nieve:#fffaf3; --tinta:#2a1d1f; --suave:#6e5f61; --linea:#ecdcd3;
}
*{box-sizing:border-box}
html{background:var(--pino)}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--nieve);padding:0 16px 60px;
  background:radial-gradient(ellipse 120% 50% at 50% 0%,#1a6b47 0%,var(--pino2) 45%,var(--pino) 100%) no-repeat,var(--pino)}
.esferas{display:block;width:100%;max-width:900px;height:auto;margin:0 auto}
.esfera{transform-box:view-box;animation:columpio 3.6s ease-in-out infinite}
@keyframes columpio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.marco{max-width:900px;margin:0 auto}
header{text-align:center;margin:4px 0 18px}
header h1{font-family:"Mountains of Christmas",cursive;font-size:clamp(36px,7vw,54px);line-height:1;margin:0;text-shadow:0 3px 0 var(--rojo2)}
header p{margin:6px 0 0;color:#cfe5d8}

.cabecera{max-width:900px;margin:6px auto 22px}
.titulo-nieve{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#nieve{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.copo{position:absolute;top:-12px;color:#fff;opacity:.85;animation:nevar linear infinite}
@keyframes nevar{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
.marco,.esferas{position:relative;z-index:1}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.tarjeta{position:relative;background:var(--nieve);color:var(--tinta);border-radius:20px;padding:26px 18px 18px;overflow:hidden;
  box-shadow:0 20px 36px -18px rgba(0,0,0,.6)}
.tarjeta::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;
  background:repeating-linear-gradient(-45deg,var(--rojo) 0 12px,#fff 12px 24px)}
.tarjeta h2{margin:0 0 12px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.tarjeta h2 .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--rojo);color:#fff;font-size:14px}
label{display:block;font-weight:800;font-size:14px;margin:0 0 6px;color:var(--suave)}
input{display:block;width:100%;font:700 18px Nunito,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--linea);
  background:#fff;color:var(--tinta);outline:none}
input:focus{border-color:var(--hoja2)}
input:focus-visible,button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

.lista{margin-top:10px;max-height:330px;overflow:auto;border:2px solid var(--linea);border-radius:12px;background:#fff}
.jug{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #f3e9df;
  background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.jug:last-child{border-bottom:0}
.jug:hover{background:#fbf4ea}
.jug.sel{background:#fde8eb;box-shadow:inset 4px 0 0 var(--rojo)}
.jug b{font-size:17px}.jug small{display:block;color:var(--suave);font-size:12px;font-weight:700}
.jug .pts{font-weight:900;color:var(--hoja2);white-space:nowrap;font-variant-numeric:tabular-nums}
.vacio{padding:16px;text-align:center;color:var(--suave)}

.elegido{border:2px dashed var(--linea);border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.elegido .quien{font-size:22px;font-weight:900}
.elegido .saldo{color:var(--suave);font-weight:700}
.elegido.nada{color:var(--suave);font-weight:700}
.calculo{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.calculo .antes{color:var(--suave)}.calculo .despues{color:var(--hoja2)}.calculo .despues.mal{color:var(--rojo)}
.alerta{margin-top:8px;color:var(--rojo);font-weight:800;font-size:14px;min-height:20px;text-align:center}

.boton{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:15px 18px;cursor:pointer;
  font:900 18px Nunito,sans-serif;color:#fff;background:var(--rojo);box-shadow:0 5px 0 var(--rojo2)}
.boton:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rojo2)}
.boton[disabled]{opacity:.45;cursor:not-allowed}
.boton.verde{background:var(--hoja2);box-shadow:0 5px 0 #145c39}
.boton.blanco{background:#fff;color:var(--rojo);border:2px solid var(--rojo);box-shadow:0 4px 0 var(--linea)}
.confirmar{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ventas{margin-top:16px}
.venta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f1e7dc}
.venta:last-child{border-bottom:0}
.venta .q{font-weight:800}.venta small{display:block;color:var(--suave);font-weight:600}
.venta .p{font-weight:900;color:var(--rojo);white-space:nowrap}
.mini{border:1.5px solid var(--linea);background:#fff;color:var(--suave);border-radius:999px;padding:6px 12px;font:800 13px Nunito,sans-serif;cursor:pointer}
.mini.peligro{border-color:var(--rojo);color:var(--rojo)}

.aviso-ok{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;background:var(--hoja2);color:#fff;
  border:2px solid var(--oro);border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.4);
  animation:entra .35s ease both;z-index:5}
@keyframes entra{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.bloqueo{max-width:520px;margin:12vh auto 0;text-align:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);
  border-radius:22px;padding:30px 22px}
.bloqueo .ico{font-size:48px}
.bloqueo h2{font-family:"Mountains of Christmas",cursive;font-size:36px;margin:8px 0}
.bloqueo p{color:#cfe5d8;line-height:1.5;margin:0}
.pie{margin-top:14px;color:#cfe5d8;font-size:13px;text-align:center}

@media (max-width:760px){.rejilla{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div id="nieve" aria-hidden="true"></div>
<svg class="esferas" id="esferas" viewBox="0 0 900 96" aria-hidden="true"></svg>
<main class="marco" id="app"><div class="bloqueo"><p>Cargando…</p></div></main>

<script>
// ====== CONFIGURACIÓN ======
var API = 'https://script.google.com/macros/s/AKfycbz3BdSkfxvH9OzpXBI4hdP0D5GQu6DWrOJOsajLLxBc3F9gvqqaVgL_Pq5Nra9zPg1s/exec';

var LLAVE = new URLSearchParams(location.hash.slice(1)).get('llave') ||
            new URLSearchParams(location.search).get('llave') || '';

var datos = { jugadores: [], ventas: [] }, evento = '';
var CABECERA = "<header class=\"cabecera\"><svg class=\"titulo-nieve\" viewBox=\"0 0 1100 150\" role=\"img\" aria-label=\"Subasta navideña\">\n  <defs>\n    <clipPath id=\"c-tit\"><text x=\"550\" y=\"110\" font-family=\"'Luckiest Guy',sans-serif\" font-size=\"100\" text-anchor=\"middle\" letter-spacing=\"4\">SUBASTA NAVIDEÑA</text></clipPath>\n    <linearGradient id=\"rojo-letra\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#e8283f\"/><stop offset=\"1\" stop-color=\"#a50e24\"/></linearGradient>\n    <linearGradient id=\"nieve-sombra\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffffff\"/><stop offset=\"1\" stop-color=\"#dbe9f3\"/></linearGradient>\n  </defs>\n  <g font-family=\"'Luckiest Guy',sans-serif\" text-anchor=\"middle\" font-size=\"100\" letter-spacing=\"4\">\n    <text x=\"550\" y=\"117\" fill=\"#5e0614\" stroke=\"#5e0614\" stroke-width=\"14\" stroke-linejoin=\"round\">SUBASTA NAVIDEÑA</text>\n    <text x=\"550\" y=\"110\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"12\" stroke-linejoin=\"round\">SUBASTA NAVIDEÑA</text>\n    <text x=\"550\" y=\"110\" fill=\"url(#rojo-letra)\">SUBASTA NAVIDEÑA</text>\n  </g>\n  <path clip-path=\"url(#c-tit)\" d=\"M-10 0 H1110 V60 Q1101.0 71.0 1092.0 60 Q1083.0 55.6 1074.0 60 Q1065.0 71.0 1056.0 60 Q1047.0 55.6 1038.0 60 Q1029.0 71.0 1020.0 60 Q1011.0 55.6 1002.0 60 Q993.0 71.0 984.0 60 Q975.0 55.6 966.0 60 Q957.0 71.0 948.0 60 Q939.0 55.6 930.0 60 Q921.0 71.0 912.0 60 Q903.0 55.6 894.0 60 Q885.0 71.0 876.0 60 Q867.0 55.6 858.0 60 Q849.0 71.0 840.0 60 Q831.0 55.6 822.0 60 Q813.0 71.0 804.0 60 Q795.0 55.6 786.0 60 Q777.0 71.0 768.0 60 Q759.0 55.6 750.0 60 Q741.0 71.0 732.0 60 Q723.0 55.6 714.0 60 Q705.0 71.0 696.0 60 Q687.0 55.6 678.0 60 Q669.0 71.0 660.0 60 Q651.0 55.6 642.0 60 Q633.0 71.0 624.0 60 Q615.0 55.6 606.0 60 Q597.0 71.0 588.0 60 Q579.0 55.6 570.0 60 Q561.0 71.0 552.0 60 Q543.0 55.6 534.0 60 Q525.0 71.0 516.0 60 Q507.0 55.6 498.0 60 Q489.0 71.0 480.0 60 Q471.0 55.6 462.0 60 Q453.0 71.0 444.0 60 Q435.0 55.6 426.0 60 Q417.0 71.0 408.0 60 Q399.0 55.6 390.0 60 Q381.0 71.0 372.0 60 Q363.0 55.6 354.0 60 Q345.0 71.0 336.0 60 Q327.0 55.6 318.0 60 Q309.0 71.0 300.0 60 Q291.0 55.6 282.0 60 Q273.0 71.0 264.0 60 Q255.0 55.6 246.0 60 Q237.0 71.0 228.0 60 Q219.0 55.6 210.0 60 Q201.0 71.0 192.0 60 Q183.0 55.6 174.0 60 Q165.0 71.0 156.0 60 Q147.0 55.6 138.0 60 Q129.0 71.0 120.0 60 Q111.0 55.6 102.0 60 Q93.0 71.0 84.0 60 Q75.0 55.6 66.0 60 Q57.0 71.0 48.0 60 Q39.0 55.6 30.0 60 Q21.0 71.0 12.0 60 Q3.0 55.6 -6.0 60 Q-15.0 71.0 -24.0 60 Z\" fill=\"url(#nieve-sombra)\"/>\n</svg></header>";
var elegido = null, busqueda = '', confirmando = false, ocupado = false;
var producto = '';
try { producto = localStorage.getItem('subasta_producto') || ''; } catch (e) {}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmt(n) { return Number(n || 0).toLocaleString('es-MX'); }
function $(id) { return document.getElementById(id); }
function sinAcentos(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

function llamar(params, ok) {
  params.llave = LLAVE;
  ocupado = true;
  return fetch(API + '?' + new URLSearchParams(params).toString())
    .then(function (r) { return r.json(); })
    .then(function (o) {
      ocupado = false;
      if (!o || o.denegado) { bloqueado(); return; }
      if (o.evento) evento = o.evento;
      datos = { jugadores: o.jugadores || [], ventas: o.ventas || [] };
      if (elegido) elegido = datos.jugadores.find(function (j) { return j.id === elegido.id; }) || null;
      if (ok) ok(o);
      pintar(o.error || '');
    })
    .catch(function () { ocupado = false; pintar('Sin conexión. Revisa el internet e intenta de nuevo.'); });
}

function bloqueado() {
  $('app').innerHTML = '<div class="bloqueo"><div class="ico">🔒</div><h2>Acceso restringido</h2>' +
    '<p>Esta página solo la puede usar el organizador de la subasta.</p></div>';
}

/* ---------- Pantalla ---------- */
function pintar(error) {
  var foco = document.activeElement && document.activeElement.id;
  var oferta = $('oferta') ? $('oferta').value : '';
  $('app').innerHTML =
    CABECERA +
    '<div class="rejilla">' +
      '<section class="tarjeta">' +
        '<h2><span class="n">1</span>¿Qué se subasta?</h2>' +
        '<label for="prod">Producto</label>' +
        '<input id="prod" maxlength="60" placeholder="Ej. Mochila" value="' + esc(producto) + '">' +
        '<h2 style="margin-top:18px"><span class="n">2</span>¿Quién ganó?</h2>' +
        '<label for="buscar">Buscar por apodo o ID</label>' +
        '<input id="buscar" placeholder="Escribe para buscar" autocomplete="off" value="' + esc(busqueda) + '">' +
        '<div class="lista" id="lista">' + listaHTML() + '</div>' +
      '</section>' +
      '<section class="tarjeta">' +
        '<h2><span class="n">3</span>Oferta ganadora</h2>' +
        elegidoHTML() +
        '<label for="oferta">Puntos que ofreció</label>' +
        '<input id="oferta" type="number" inputmode="numeric" min="1" step="1" placeholder="Ej. 600" value="' + esc(oferta) + '">' +
        '<div id="calculo"></div>' +
        '<div class="alerta" id="alerta">' + esc(error || '') + '</div>' +
        '<div id="acciones"></div>' +
        '<div class="ventas"><h2>🧾 Ventas de la subasta</h2>' + ventasHTML() + '</div>' +
      '</section>' +
    '</div>' +
    '<p class="pie">Cada venta descuenta los puntos del saldo del jugador. Los lugares del tablero no cambian.</p>';

  $('prod').oninput = function () {
    producto = this.value;
    try { localStorage.setItem('subasta_producto', producto); } catch (e) {}
    actualizarCalculo();
  };
  $('buscar').oninput = function () { busqueda = this.value; $('lista').innerHTML = listaHTML(); enlazarLista(); };
  $('oferta').oninput = function () { confirmando = false; actualizarCalculo(); };
  enlazarLista();
  enlazarVentas();
  actualizarCalculo();
  if (foco && $(foco)) { var el = $(foco); el.focus(); if (el.setSelectionRange && el.type !== 'number') el.setSelectionRange(el.value.length, el.value.length); }
}

function listaHTML() {
  var q = sinAcentos(busqueda.trim());
  var js = datos.jugadores.filter(function (j) {
    return !q || sinAcentos(j.apodo).indexOf(q) >= 0 || sinAcentos(j.id).indexOf(q) >= 0;
  });
  if (!js.length) return '<div class="vacio">' + (datos.jugadores.length ? 'Nadie coincide con esa búsqueda.' : 'Todavía no hay jugadores.') + '</div>';
  return js.map(function (j) {
    return '<button class="jug' + (elegido && elegido.id === j.id ? ' sel' : '') + '" data-id="' + esc(j.id) + '">' +
      '<span><b>' + esc(j.apodo) + '</b><small>' + esc(j.id) + '</small></span>' +
      '<span class="pts">' + fmt(j.disponibles) + ' pts</span></button>';
  }).join('');
}

function enlazarLista() {
  var bs = document.querySelectorAll('.jug');
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var id = this.getAttribute('data-id');
      elegido = datos.jugadores.find(function (j) { return j.id === id; }) || null;
      confirmando = false;
      pintar('');
      if ($('oferta')) $('oferta').focus();
    };
  }
}

function elegidoHTML() {
  if (!elegido) return '<div class="elegido nada">Elige al ganador en la lista.</div>';
  return '<div class="elegido"><div class="quien">' + esc(elegido.apodo) + ' <small style="color:var(--suave)">(' + esc(elegido.id) + ')</small></div>' +
    '<div class="saldo">Tiene ' + fmt(elegido.disponibles) + ' puntos disponibles</div></div>';
}

function oferta() { var v = Math.round(Number($('oferta') && $('oferta').value)); return v > 0 ? v : 0; }

function actualizarCalculo() {
  var n = oferta(), cal = $('calculo'), acc = $('acciones'), al = $('alerta');
  var prod = producto.trim();
  if (!elegido || !n) {
    cal.innerHTML = '';
    acc.innerHTML = '<button class="boton" disabled>Cobrar puntos</button>';
    return;
  }
  var queda = elegido.disponibles - n, mal = queda < 0;
  cal.innerHTML = '<div class="calculo"><span class="antes">' + fmt(elegido.disponibles) + '</span><span>−</span><span>' + fmt(n) +
    '</span><span>=</span><span class="despues' + (mal ? ' mal' : '') + '">' + fmt(queda) + ' pts</span></div>';
  if (mal) { al.textContent = elegido.apodo + ' no tiene puntos suficientes.'; }
  else if (al.textContent.indexOf('no tiene puntos') >= 0) { al.textContent = ''; }

  if (!confirmando) {
    acc.innerHTML = '<button class="boton" id="cobrar"' + (mal || ocupado ? ' disabled' : '') + '>Cobrar ' + fmt(n) + ' pts' +
      (prod ? ' por ' + esc(prod) : '') + '</button>';
    if ($('cobrar')) $('cobrar').onclick = function () { confirmando = true; actualizarCalculo(); };
  } else {
    acc.innerHTML = '<p style="text-align:center;font-weight:800;margin:12px 0 0">¿Confirmas? ' + esc(elegido.apodo) + ' paga ' + fmt(n) +
      ' pts' + (prod ? ' por <b>' + esc(prod) + '</b>' : '') + '.</p>' +
      '<div class="confirmar"><button class="boton blanco" id="no">Cancelar</button><button class="boton verde" id="si">Sí, cobrar</button></div>';
    $('no').onclick = function () { confirmando = false; actualizarCalculo(); };
    $('si').onclick = function () { vender(n, prod); };
  }
}

function vender(n, prod) {
  if (ocupado) return;
  $('acciones').innerHTML = '<button class="boton" disabled>Cobrando…</button>';
  llamar({ api: 'vender', id: elegido.id, puntos: n, producto: prod || 'Producto' }, function (o) {
    confirmando = false;
    if (o.vendido) {
      var v = o.vendido;
      if ($('oferta')) $('oferta').value = '';
      aviso('✅ ' + v.producto + ' para ' + v.apodo + ' por ' + fmt(v.puntos) + ' pts. Le quedan ' + fmt(v.quedan) + '.');
    }
  });
}

function ventasHTML() {
  if (!datos.ventas.length) return '<div class="vacio">Aún no hay ventas.</div>';
  return datos.ventas.map(function (v) {
    var hora = v.fecha ? new Date(v.fecha).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="venta"><div><div class="q">' + esc(v.producto) + ' → ' + esc(v.apodo) + '</div>' +
      '<small>' + esc(v.id) + (hora ? ' · ' + hora : '') + '</small></div>' +
      '<div style="display:flex;align-items:center;gap:8px"><span class="p">−' + fmt(v.puntos) + '</span>' +
      '<button class="mini" data-venta="' + esc(v.venta) + '">Deshacer</button></div></div>';
  }).join('');
}

function enlazarVentas() {
  var bs = document.querySelectorAll('.mini[data-venta]');
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var b = this, id = b.getAttribute('data-venta');
      if (!b.classList.contains('peligro')) { b.classList.add('peligro'); b.textContent = '¿Seguro?'; return; }
      b.textContent = '…';
      llamar({ api: 'deshacer', venta: id }, function (o) { if (o.deshecho) aviso('↩️ Venta deshecha. Se devolvieron los puntos.'); });
    };
  }
}

function aviso(t) {
  var d = document.createElement('div');
  d.className = 'aviso-ok'; d.setAttribute('role', 'status'); d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 4500);
}

/* ---------- Decoración ---------- */
function esferas() {
  var svg = $('esferas'), h = '';
  var col = ['#c8102e', '#f2c14e', '#2f9e62', '#ffffff', '#d9dde3'];
  var largo = [20, 40, 16, 46, 24, 36, 18, 44, 22, 34, 18, 42, 26, 30, 20, 40];
  for (var i = 0; i < 16; i++) {
    var x = 28 + i * 56, L = largo[i], r = 11 + (i % 3) * 2.5, c = col[i % col.length], cy = L + 8 + r;
    h += '<g class="esfera" style="transform-origin:' + x + 'px 0px;animation-delay:-' + (i * 0.4) + 's">' +
      '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (L + 2) + '" stroke="#f2c14e" stroke-width="1.2"/>' +
      '<rect x="' + (x - 4) + '" y="' + L + '" width="8" height="8" rx="1.5" fill="#d4a63a"/>' +
      '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="' + c + '"/>' +
      '<ellipse cx="' + (x - r * 0.38) + '" cy="' + (cy - r * 0.4) + '" rx="' + (r * 0.28) + '" ry="' + (r * 0.18) +
        '" fill="#fff" opacity=".7" transform="rotate(-35 ' + (x - r * 0.38) + ' ' + (cy - r * 0.4) + ')"/></g>';
  }
  svg.innerHTML = h;
}

function nieve() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cont = $('nieve');
  for (var i = 0; i < 45; i++) {
    var c = document.createElement('div');
    c.className = 'copo';
    c.textContent = Math.random() < 0.4 ? '❄' : '•';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = (8 + Math.random() * 14) + 'px';
    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    c.style.animationDuration = (8 + Math.random() * 8) + 's';
    c.style.animationDelay = -(Math.random() * 16) + 's';
    cont.appendChild(c);
  }
}

/* ---------- Arranque ---------- */
esferas();
nieve();
