<title>Subasta navideña</title>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0c3b29;cursor:none}
body{background:radial-gradient(ellipse 90% 70% at 50% 20%,#1a6b47 0%,#0f4d32 50%,#0a3324 100%)}
#escena{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#nieve{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.copo{position:absolute;top:-14px;color:#fff;opacity:.8;animation:nevar linear infinite}
@keyframes nevar{to{transform:translate(var(--dx),105vh) rotate(360deg)}}

.esfera{transform-box:view-box;animation:columpio 3.8s ease-in-out infinite}
@keyframes columpio{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.titulo{animation:respira 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* Santa subastador */
.santa-cuerpo{animation:rebote 3.2s ease-in-out infinite}
@keyframes rebote{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mazo{transform-box:view-box;transform-origin:303px 156px;animation:martillazo 3.2s ease-in-out infinite}
@keyframes martillazo{0%,60%{transform:rotate(-42deg)}74%{transform:rotate(-48deg)}80%{transform:rotate(3deg)}86%{transform:rotate(0)}100%{transform:rotate(-42deg)}}
.golpe{opacity:0;animation:golpe 3.2s linear infinite}
@keyframes golpe{0%,79%{opacity:0}80%,90%{opacity:1}100%{opacity:0}}
.vendido{transform-box:fill-box;transform-origin:0% 100%;opacity:0;animation:vendido 6.4s ease-out infinite}
@keyframes vendido{0%,37%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.08)}43%{transform:scale(1)}62%{opacity:1}68%,100%{opacity:0;transform:scale(1)}}

/* Duendes */
.duende{animation:rebote 1.4s ease-in-out infinite}
.d2{animation-duration:1.8s}
.duende-cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:asiente 2.2s ease-in-out infinite}
@keyframes asiente{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}}
.brazo-envuelve{transform-box:fill-box;transform-origin:0% 0%;animation:envuelve .7s ease-in-out infinite alternate}
@keyframes envuelve{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
.duende-brazo{transform-box:fill-box;transform-origin:0% 10%;animation:lee 2.2s ease-in-out infinite}
@keyframes lee{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}

/* Regalo que se envuelve */
.mono{transform-box:fill-box;transform-origin:50% 100%;animation:mono 4s ease-in-out infinite}
@keyframes mono{0%,35%{transform:scale(0);opacity:0}45%{transform:scale(1.2);opacity:1}52%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.papel{animation:papel 4s ease-in-out infinite}
@keyframes papel{0%{opacity:0}10%,30%{opacity:1}40%,100%{opacity:0}}
.brillo{transform-box:fill-box;transform-origin:50% 50%;animation:destello 4s ease-in-out infinite}
@keyframes destello{0%,44%{opacity:0;transform:scale(.2) rotate(0)}52%{opacity:1;transform:scale(1) rotate(45deg)}64%,100%{opacity:0;transform:scale(.4) rotate(90deg)}}

/* Banda transportadora */
.rodillo{animation:gira 1s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes gira{to{transform:rotate(360deg)}}
.cinta-linea{stroke-dasharray:14 14;animation:cinta 1s linear infinite}
@keyframes cinta{to{stroke-dashoffset:-28}}
.viaja{animation:viaja 12s linear infinite}
@keyframes viaja{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(290px);opacity:0}}

.luz{animation:parpadeo 1.4s ease-in-out infinite}
@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}#nieve{display:none}}
</style>

<script>
// Esferas colgantes
(function () {
  var g = document.getElementById('esferas'), h = '';
  var col = ['#c8102e', '#f2c14e', '#2f9e62', '#ffffff', '#d9dde3'];
  var largo = [20, 38, 14, 30, 22, 42, 16, 34, 24, 18, 36, 26, 14, 40, 20, 32, 18, 28, 22];
  for (var i = 0; i < 19; i++) {
    var x = 40 + i * 84, L = largo[i], r = 12 + (i % 3) * 3, c = col[i % col.length], cy = L + 8 + r;
    h += '<g class="esfera" style="transform-origin:' + x + 'px 0px;animation-delay:-' + (i * 0.4) + 's">' +
      '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (L + 2) + '" stroke="#f2c14e" stroke-width="1.4"/>' +
      '<rect x="' + (x - 5) + '" y="' + L + '" width="10" height="9" rx="2" fill="#d4a63a"/>' +
      '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="' + c + '"/>' +
      '<path d="M' + (x - r) + ' ' + cy + ' Q' + x + ' ' + (cy + r * 0.45) + ' ' + (x + r) + ' ' + cy + '" stroke="' +
        (c === '#ffffff' ? '#c8102e' : '#ffffff') + '" stroke-opacity=".55" stroke-width="2" fill="none"/>' +
      '<ellipse cx="' + (x - r * 0.38) + '" cy="' + (cy - r * 0.4) + '" rx="' + (r * 0.28) + '" ry="' + (r * 0.18) +
        '" fill="#fff" opacity=".7" transform="rotate(-35 ' + (x - r * 0.38) + ' ' + (cy - r * 0.4) + ')"/></g>';
  }
  g.innerHTML = h;
})();

// Nieve ligera
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cont = document.getElementById('nieve');
  for (var i = 0; i < 50; i++) {
    var c = document.createElement('div');
    c.className = 'copo';
    c.textContent = Math.random() < 0.35 ? '❄' : '•';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = (8 + Math.random() * 16) + 'px';
    c.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    c.style.animationDuration = (9 + Math.random() * 9) + 's';
    c.style.animationDelay = -(Math.random() * 18) + 's';
    cont.appendChild(c);
  }
})();

// Doble clic o tecla F para pantalla completa
function completa() {
  var d = document.documentElement;
  if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
}
document.addEventListener('dblclick', completa);
document.addEventListener('keydown', function (e) { if (e.key === 'f' || e.key === 'F') completa(); });
</script>
